[project]
name = "renderdoc-mcp"
version = "2.1.0"
description = "MCP server for RenderDoc graphics debugging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.0,<5.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
renderdoc-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "psutil>=7", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
